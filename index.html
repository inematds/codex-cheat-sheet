<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Cheat Sheet — referência do OpenAI Codex CLI</title>
<meta name="description" content="Folha de consulta do OpenAI Codex CLI: instalação, comandos, configuração, MCP, sandbox, skills e workflows. Em português e inglês, com busca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c10; --bg2:#14141b; --card:#16161e; --line:#272730;
    --txt:#e9e9ee; --mut:#9a9aa6; --amb:#E2A23B; --amb2:#f0c070; --sky:#38bdf8; --pro:#cbd5e1;
    color-scheme:dark;
  }
  body.light{
    --bg:#f6f7f9; --bg2:#eceef2; --card:#ffffff; --line:#e1e3ea;
    --txt:#1a1a22; --mut:#5b5b68; --amb:#b9791d; --amb2:#a16207; --sky:#0369a1; --pro:#b45309;
    color-scheme:light;
  }
  body.light .hero .glow{opacity:.5}
  body.light pre{background:#0e0e14;color:#d6d6e0}
  body.light pre .c{color:#8a8a98}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.65 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Sora,sans-serif;line-height:1.15;margin:0}
  a{color:var(--amb);text-decoration:none}
  code,pre{font-family:"JetBrains Mono",monospace}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  .mut{color:var(--mut)} .amb{color:var(--amb)}
  .chip{display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amb);font-weight:600;font-family:Sora}
  nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);background:rgba(12,12,16,.78);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;gap:22px;height:60px}
  nav .brand{display:flex;align-items:center;gap:8px;font-family:Sora;font-weight:800;letter-spacing:-.02em;color:var(--amb)}
  nav .brand .emoji{font-size:1.25rem}
  nav .sep{color:var(--mut);opacity:.45}
  nav .inema{color:var(--sky);font-weight:600;font-size:.88rem;font-family:Sora}
  nav .inema:hover{filter:brightness(1.15)}
  nav .pro{color:var(--pro);font-weight:600;font-size:.88rem;font-family:Sora}
  nav .pro:hover{filter:brightness(1.15)}
  nav .clubpro{display:inline-flex;align-items:center;gap:6px}
  nav .links{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:.92rem}
  nav .links a.sec{color:var(--mut)} nav .links a.sec:hover{color:var(--txt)}
  .tgl{background:var(--bg2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem}
  .tgl:hover{border-color:var(--amb)}
  .btn{display:inline-block;background:var(--amb);color:#1a1206;font-weight:600;padding:.6em 1.05em;border-radius:10px;font-family:Sora}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  @media(max-width:760px){nav .links a.sec{display:none}}
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .hero .glow{position:absolute;inset:-40% -20% auto auto;width:70%;height:600px;background:radial-gradient(closest-side,rgba(226,162,59,.22),transparent 70%);pointer-events:none}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:74px 22px}
  .hero h1{font-size:clamp(2.2rem,5vw,3.5rem);font-weight:800;letter-spacing:-.025em}
  .hero p.lead{font-size:1.18rem;color:var(--mut);margin:1.1em 0 1.6em;max-width:34ch}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap}
  .hero figure{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -30px #000}
  .hero figure img{width:100%;display:block}
  @media(max-width:780px){.hero .wrap{grid-template-columns:1fr;padding:48px 22px}}
  section{padding:62px 0;border-bottom:1px solid var(--line)}
  section h2{font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.02em}
  section .sub{color:var(--mut);margin:.6em 0 2em;max-width:62ch}
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:820px){.g3,.g4{grid-template-columns:1fr 1fr}}
  @media(max-width:540px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h3{font-size:1.05rem;margin-bottom:.4em}
  .card p{color:var(--mut);font-size:.92rem;margin:0}
  .num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:8px;background:rgba(226,162,59,.14);color:var(--amb);font-family:Sora;font-weight:800;font-size:.9rem;margin-bottom:.7em}
  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .flow span{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:.45em .9em;font-size:.85rem;font-family:Sora;font-weight:600}
  .flow .arr{color:var(--amb);border:none;background:none;padding:0 .1em}
  pre{background:#0a0a0e;border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:auto;font-size:.86rem;line-height:1.6;color:#d6d6e0}
  pre .c{color:#6f6f7c} pre .k{color:var(--amb2)} pre .s{color:#9ece6a}
  .step{display:grid;grid-template-columns:46px 1fr;gap:16px;margin-bottom:26px}
  .step .b{width:46px;height:46px;border-radius:12px;background:var(--amb);color:#1a1206;font-family:Sora;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
  .step h3{font-size:1.12rem;margin-bottom:.3em}
  .step p{color:var(--mut);margin:.2em 0 .7em}
  .ex{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:680px){.ex{grid-template-columns:1fr}}
  .ex figure{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .ex figure img{width:100%;display:block}
  .ex figcaption{padding:12px 14px;font-size:.88rem;color:var(--mut);background:var(--card)}
  .phase{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
  .phase:last-child{border:none}
  .phase .tag{flex:0 0 92px;font-family:Sora;font-weight:800;color:var(--amb)}
  .phase .d strong{display:block;margin-bottom:.2em}
  .phase .d span{color:var(--mut);font-size:.92rem}
  footer{padding:46px 0;text-align:center;color:var(--mut);font-size:.9rem}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.3em .8em;font-size:.78rem;color:var(--mut);margin:0 4px}
</style><style>
  .sheet{display:grid;grid-template-columns:250px 1fr;gap:34px;padding:34px 0 70px}
  @media(max-width:900px){.sheet{grid-template-columns:1fr}.toc{position:static!important;max-height:none!important}}
  .toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:.9rem}
  .toc a{display:block;color:var(--mut);padding:.32em 0;border-left:2px solid transparent;padding-left:10px}
  .toc a:hover{color:var(--txt)} .toc a.h3{padding-left:22px;font-size:.85rem}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .toolbar input{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:.66em .9em;font:inherit;font-size:.94rem}
  .toolbar input:focus{outline:none;border-color:var(--amb)}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lang button{background:var(--bg2);border:0;color:var(--mut);font:inherit;font-size:.86rem;padding:.6em .9em;cursor:pointer}
  .lang button.on{background:var(--amb);color:#1a1206;font-weight:600}
  .doc h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:800;letter-spacing:-.025em;margin:.2em 0 .5em}
  .doc h2{font-size:1.5rem;font-weight:800;margin:1.9em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
  .doc h3{font-size:1.12rem;margin:1.3em 0 .4em}
  .doc p{color:var(--mut)} .doc li{color:var(--mut);margin:.25em 0}
  .doc details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:12px 0}
  .doc details[open]{padding-bottom:12px}
  .doc summary{cursor:pointer;padding:14px 0;font-family:Sora;font-weight:600;color:var(--txt);list-style:none}
  .doc summary::-webkit-details-marker{display:none}
  .doc summary::before{content:"▸ ";color:var(--amb)}
  .doc details[open] summary::before{content:"▾ "}
  .doc table{width:100%;border-collapse:collapse;font-size:.9rem;margin:14px 0;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:.55em .7em;text-align:left}
  .doc th{background:var(--bg2);font-family:Sora}
  .doc td{color:var(--mut)}
  .doc code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:.1em .38em;font-size:.88em;color:var(--amb2)}
  .doc pre code{background:none;border:0;padding:0;color:inherit}
  .doc blockquote{border-left:3px solid var(--amb);margin:14px 0;padding:.2em 0 .2em 14px;color:var(--mut)}
  .doc img{max-width:100%}
  mark{background:rgba(226,162,59,.35);color:inherit;border-radius:3px}
  .hidden{display:none}
  .loading{color:var(--mut);padding:40px 0}
</style>
</head>
<body>

<nav><div class="wrap">
  <a class="brand" href="#top"><span class="emoji">⚡</span> Codex Cheat Sheet</a>
  <span class="sep">|</span>
  <span class="clubpro">
    <a class="inema" href="https://inema.club" target="_blank" rel="noopener">INEMA.CLUB</a>
    <span class="sep">-</span>
    <a class="pro" href="https://inema.pro" target="_blank" rel="noopener">PRO</a>
  </span>
  <div class="links">
    <a class="sec" href="guia/">Guia de uso</a>
    <a class="sec" href="#top">Folha de consulta</a>
    <button class="tgl" id="themeToggle" aria-label="Alternar tema" title="Alternar tema">🌙</button>
    <a class="btn" href="https://github.com/inematds/codex-cheat-sheet" target="_blank" rel="noopener">GitHub</a>
  </div>
</div></nav>

<div class="wrap sheet" id="top">
  <aside class="toc" id="toc"></aside>
  <main>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Buscar comando, flag ou seção… (ex.: sandbox, /goal, mcp)" autocomplete="off">
      <span class="lang">
        <button id="btPT" class="on">Português</button><button id="btEN">English</button>
      </span>
      <a class="btn ghost" href="guia/">Guia passo a passo</a>
    </div>
    <div class="doc" id="doc"><p class="loading">Carregando a folha de consulta…</p></div>
  </main>
</div>

<footer>
  <div class="wrap">
    <div class="pill">Markdown</div><div class="pill">OpenAI Codex CLI</div><div class="pill">GitHub Pages</div>
    <p style="margin-top:18px">Codex Cheat Sheet · baseado na documentação oficial da OpenAI ·
      <a href="https://github.com/inematds/codex-cheat-sheet">inematds/codex-cheat-sheet</a> ·
      <a href="https://inema.club">INEMA.CLUB</a></p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
  var KEY='codex-cheat-sheet-theme';
  var b=document.body, t=document.getElementById('themeToggle');
  if(localStorage.getItem(KEY)==='light'){ b.classList.add('light'); t.textContent='☀️'; }
  t.addEventListener('click',function(){
    var light=b.classList.toggle('light');
    t.textContent=light?'☀️':'🌙';
    localStorage.setItem(KEY, light?'light':'dark');
  });
})();

(function(){
  var doc=document.getElementById('doc'), toc=document.getElementById('toc'), q=document.getElementById('q');
  var btPT=document.getElementById('btPT'), btEN=document.getElementById('btEN');
  var LKEY='codex-cheat-sheet-lang', cache={};

  function slug(s){return s.toLowerCase().replace(/[^\w\u00C0-\u017F]+/g,'-').replace(/^-|-$/g,'');}

  function buildToc(){
    toc.innerHTML='';
    doc.querySelectorAll('h2,h3').forEach(function(h){
      if(!h.id) h.id=slug(h.textContent);
      var a=document.createElement('a');
      a.href='#'+h.id; a.textContent=h.textContent;
      if(h.tagName==='H3') a.className='h3';
      toc.appendChild(a);
    });
  }

  function render(md){
    doc.innerHTML=marked.parse(md);
    // remove o bloco de cabecalho centralizado duplicado
    var d=doc.querySelector('div[align="center"]'); if(d) d.remove();
    buildToc();
    if(q.value) filter();
  }

  function load(lang){
    var file = lang==='en' ? 'README.md' : 'README.pt-BR.md';
    btPT.classList.toggle('on', lang!=='en');
    btEN.classList.toggle('on', lang==='en');
    localStorage.setItem(LKEY, lang);
    document.documentElement.lang = lang==='en' ? 'en' : 'pt-BR';
    q.placeholder = lang==='en'
      ? 'Search a command, flag or section… (e.g. sandbox, /goal, mcp)'
      : 'Buscar comando, flag ou seção… (ex.: sandbox, /goal, mcp)';
    if(cache[file]){ render(cache[file]); return; }
    doc.innerHTML='<p class="loading">…</p>';
    fetch(file).then(function(r){return r.text();}).then(function(md){ cache[file]=md; render(md); })
      .catch(function(){ doc.innerHTML='<p class="loading">Não consegui carregar '+file+'.</p>'; });
  }

  function filter(){
    var term=q.value.trim().toLowerCase();
    var blocks=doc.querySelectorAll('details');
    if(!term){
      blocks.forEach(function(el){el.classList.remove('hidden');el.open=false;});
      doc.querySelectorAll('h2,h3,p,table,ul,blockquote').forEach(function(el){el.classList.remove('hidden');});
      return;
    }
    doc.querySelectorAll('h2,p,table,ul,blockquote').forEach(function(el){el.classList.add('hidden');});
    blocks.forEach(function(el){
      var hit = el.textContent.toLowerCase().indexOf(term) !== -1;
      el.classList.toggle('hidden', !hit);
      el.open = hit;
      if(hit){
        var h=el.closest('div,main');
        var prev=el.previousElementSibling;
        while(prev && prev.tagName!=='H2'){ prev=prev.previousElementSibling; }
        if(prev) prev.classList.remove('hidden');
      }
    });
  }

  q.addEventListener('input', filter);
  btPT.addEventListener('click', function(){ load('pt'); });
  btEN.addEventListener('click', function(){ load('en'); });
  load(localStorage.getItem(LKEY)==='en' ? 'en' : 'pt');
})();
</script>
</body>
</html>
